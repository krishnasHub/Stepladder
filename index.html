      :root {

      }
      html,
      body {
        margin: 0;
        padding: 0;

        height: 100%;
        overflow: hidden;
        background: #20222e;
        /* Kill mobile browser gestures that fight a game canvas. */

        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;

      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        /* Crisp pixels at every scale factor. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
